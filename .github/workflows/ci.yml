name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run check:content
      - run: npm test
      - run: npm run test:legacy
      - run: npm run build:all
      - run: npm run export -- --lesson=parabola-midpoint-chord --audience=student
      - run: npm run export -- --lesson=parabola-midpoint-chord --audience=teacher
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: offline-pages
          path: |
            dist/
            artifacts/
