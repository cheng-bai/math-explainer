<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="author" content="chengbai"><title>数学讲解实验室 · Math Explainer</title></head><body>
<header class="masthead"><a href="#" class="brand">数学讲解实验室<small>MATH EXPLAINER / 0.1</small></a><button id="theme">深色纸面</button></header>
<div class="shell"><aside class="library"><p class="eyebrow">从一个问题，走向一种方法</p><h2>讲解目录</h2><nav id="lesson-nav" aria-label="选择讲解"></nav><a class="legacy-link" href="./legacy/conics/conics-lab.html">圆锥曲线原实验 ↗<small>三个曲线 · 24 个入口</small></a><p class="library-note">先看什么在变，再说为什么成立。图形帮助理解，证明决定结论。</p></aside>
<main><header class="intro"><div id="topic" class="eyebrow"></div><h1 id="lesson-title"></h1><p id="summary"></p></header>
<section class="problem"><div class="section-label">题目 / 学习目标</div><div id="statement"></div><p id="source" class="source"></p><p class="prereq">前置知识：<span id="prerequisites"></span></p></section>
<div id="paths" class="paths" aria-label="选择讲解方法"></div>
<div class="workspace"><section class="figure"><div class="figure-title"><span>FIG. / 同一模型，同一读数</span><span>等比例坐标 · 有限窗口</span></div><svg id="plot" role="img" tabindex="0" aria-label="数学模型图"></svg><div id="metrics" class="metrics"></div><div id="controls" class="controls"></div><div class="figure-actions"><button id="reset">复位当前步骤</button><span>可拖动滑块；图形聚焦后用 ← → 调参</span></div><p id="scene-status" role="status" aria-live="polite"></p></section>
<article class="reasoning"><div id="steps" class="steps" aria-label="推理步骤"></div><div class="step-content"><p class="eyebrow">这一步，为什么这样想</p><h2 id="step-title"></h2><p id="step-why" class="why"></p><div id="step-body"></div><div class="step-actions"><button id="prev-step">上一步</button><span id="step-progress"></span><button id="next-step">下一步</button></div></div></article></div>
<details class="boundaries"><summary>边界、反例与最后核验</summary><div id="boundaries"></div></details>
<footer><span>教师讲解版 · 自编公开示例 · 单文件可离线运行</span><button id="copy-state">复制当前步骤链接</button><p id="copy-status" role="status"></p></footer></main></div>
